<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Switch icon -->
  <rect width="500" height="500" fill="#4CAF50" rx="80"/>
  
  <!-- Outlet/Socket shape -->
  <g transform="translate(250, 250)">
    <!-- Socket body -->
    <rect x="-100" y="-100" width="200" height="200" fill="#FFFFFF" rx="20"/>
    
    <!-- Power symbol -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#4CAF50" stroke-width="15"/>
    <line x1="0" y1="-60" x2="0" y2="0" stroke="#4CAF50" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>

