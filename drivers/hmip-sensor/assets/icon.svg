<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Sensor icon -->
  <rect width="500" height="500" fill="#2196F3" rx="80"/>
  
  <!-- Sensor body -->
  <g transform="translate(250, 250)">
    <!-- Sensor circle -->
    <circle cx="0" cy="0" r="120" fill="#FFFFFF"/>
    
    <!-- Signal waves -->
    <path d="M -60 -60 Q -80 0 -60 60" fill="none" stroke="#2196F3" stroke-width="12" stroke-linecap="round"/>
    <path d="M -30 -40 Q -40 0 -30 40" fill="none" stroke="#2196F3" stroke-width="12" stroke-linecap="round"/>
    <path d="M 30 -40 Q 40 0 30 40" fill="none" stroke="#2196F3" stroke-width="12" stroke-linecap="round"/>
    <path d="M 60 -60 Q 80 0 60 60" fill="none" stroke="#2196F3" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="15" fill="#2196F3"/>
  </g>
</svg>

