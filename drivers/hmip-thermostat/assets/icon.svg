<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Thermostat icon -->
  <rect width="500" height="500" fill="#FF5722" rx="80"/>
  
  <!-- Thermostat body -->
  <g transform="translate(250, 250)">
    <!-- Circle body -->
    <circle cx="0" cy="0" r="140" fill="#FFFFFF"/>
    
    <!-- Temperature dial -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FF5722" stroke-width="20"/>
    
    <!-- Indicator -->
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#FF5722" stroke-width="15" stroke-linecap="round"/>
    
    <!-- Temperature text -->
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FF5722" text-anchor="middle">21°</text>
  </g>
</svg>

