<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Blinds/Shutters icon -->
  <rect width="500" height="500" fill="#795548" rx="80"/>
  
  <!-- Window covering -->
  <g transform="translate(250, 250)">
    <!-- Blinds slats -->
    <rect x="-100" y="-120" width="200" height="30" fill="#FFFFFF" rx="5"/>
    <rect x="-100" y="-80" width="200" height="30" fill="#FFFFFF" rx="5"/>
    <rect x="-100" y="-40" width="200" height="30" fill="#FFFFFF" rx="5"/>
    <rect x="-100" y="0" width="200" height="30" fill="#FFFFFF" rx="5"/>
    <rect x="-100" y="40" width="200" height="30" fill="#FFFFFF" rx="5"/>
    <rect x="-100" y="80" width="200" height="30" fill="#FFFFFF" rx="5"/>
    
    <!-- Control arrows -->
    <path d="M -20 -140 L 0 -160 L 20 -140" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -20 130 L 0 150 L 20 130" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

